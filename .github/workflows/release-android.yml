name: Release Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-android:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK
        run: eas build --platform android --profile release-apk --non-interactive --wait --json > eas-build.json

      - name: Download Android APK
        env:
          APK_NAME: cookietrail-${{ github.ref_name }}.apk
        run: |
          build_url="$(jq -er '.[0].artifacts.buildUrl' eas-build.json)"
          curl --fail --location --retry 3 --output "$APK_NAME" "$build_url"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: cookietrail-${{ github.ref_name }}.apk
        run: gh release create "$GITHUB_REF_NAME" "$APK_NAME" --generate-notes --title "$GITHUB_REF_NAME"
